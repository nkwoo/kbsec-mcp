# API 코드 -> MCP tool 이름/소속 파일 매핑
# scripts/generate_tools.py가 이 파일과 spec/kbsec_api_spec.json을 합쳐 tools/<file>.py를 생성한다.
# trading: true 인 항목은 실제 주문 접수/정정/취소를 수행하는 도구로, KBSEC_ENABLE_TRADING=true가
# 아니면 client.py가 호출을 차단한다 (매수가능금액 조회 등은 실거래가 아니므로 제외).
